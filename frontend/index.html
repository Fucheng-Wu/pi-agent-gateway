<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="可嵌入现有系统的 Pi Agent 后端与前后端分离 Web 控制台" />
    <script>
      try {
        const savedTheme = localStorage.getItem('pi-agent-gateway-theme') || localStorage.getItem('pi-studio-theme')
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.dataset.theme = savedTheme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', savedTheme === 'dark' ? '#292a2d' : '#ffffff')
        }
      } catch { /* Keep the default light theme when storage is unavailable. */ }
    </script>
    <title>Pi Agent Gateway</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
